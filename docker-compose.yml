services:
  db:
    image: mariadb:11
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME}
      TZ: Asia/Bangkok
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    restart: always
    environment:
      TZ: Asia/Bangkok
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    restart: always
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=development
      - TZ=Asia/Bangkok
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET}
      - NUXT_HOST=0.0.0.0
      - NUXT_PORT=3000
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - THAID_CLIENT_ID=${THAID_CLIENT_ID}
      - THAID_CLIENT_SECRET=${THAID_CLIENT_SECRET}
      - THAID_REDIRECT_URI=${THAID_REDIRECT_URI}
      - THAID_BASE_URL=${THAID_BASE_URL}
      - THAID_TOKEN_URL=${THAID_TOKEN_URL}
      - THAID_USERINFO_URL=${THAID_USERINFO_URL}
    depends_on:
      - db
      - redis
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.nuxt
      - ./storage:/app/storage
    command: npm run dev

volumes:
  db_data:
  redis_data:
