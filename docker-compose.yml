# Nuxt App
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tracker-app
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: ${PORT:-3000}
      
      # 1. ส่งตัวแปรเดี่ยวสำหรับโค้ดรุ่นเก่าให้อ่านจับคู่ได้ถูกตัว
      DB_HOST: mariadb  # <--- ชี้ไปที่ชื่อ service mariadb ในเน็ตเวิร์กเดียวกัน
      DB_PORT: 3306
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}

      # 2. ส่งแบบ URL String สำรองไว้สำหรับส่วนอื่น (เช่น ตระกูล Prisma/Drizzle ตัวใหม่ๆ)
      DATABASE_URL: mysql://${DB_USER}:${DB_PASSWORD}@mariadb:3306/${DB_NAME}
      
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redispassword}
      
      # Auth & ThaiID
      JWT_SECRET: ${JWT_SECRET}
      THAID_CLIENT_ID: ${THAID_CLIENT_ID}
      THAID_CLIENT_SECRET: ${THAID_CLIENT_SECRET}
      THAID_REDIRECT_URI: ${THAID_REDIRECT_URI}
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    volumes:
      - tracker_public_uploads:/app/public/uploads
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:${PORT:-3000}/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - tracker-network
