version: '3.9'

services:
  # MariaDB Database
  mariadb:
    image: mariadb:11.4
    container_name: mis-mariadb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mis_db}
      MYSQL_USER: ${MYSQL_USER:-mis_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-mis_password}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - mis-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: mis-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redispassword}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - mis-network

  # Nuxt App
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mis-app
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      # [แก้ไข] ให้แอป Nuxt ภายในเปิดตามพอร์ตที่กำหนดใน .env (Default: 3000)
      PORT: ${PORT:-3000}
      # Database
      DATABASE_URL: mysql://${MYSQL_USER:-mis_user}:${MYSQL_PASSWORD:-mis_password}@mariadb:3306/${MYSQL_DATABASE:-mis_db}
      # Redis
      REDIS_HOST: redis
      # พอร์ตเชื่อมต่อภายในโครงสร้างของ Container Network ไปหา Redis ให้คงพอร์ตมาตรฐาน 6379 เอาไว้
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redispassword}
      # JWT
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      # ThaiID OAuth
      THAID_CLIENT_ID: ${THAID_CLIENT_ID}
      # ปรับปรุงให้ยืดหยุ่นตามพอร์ตแอปจริง
      THAID_CLIENT_SECRET: ${THAID_CLIENT_SECRET}
      THAID_REDIRECT_URI: ${THAID_REDIRECT_URI:-http://localhost:${PORT:-3000}/api/auth/thaid/callback}
    ports:
      # [แก้ไข] ปรับพอร์ตทางฝั่งซ้าย (Host) และขวา (Container) ให้ดึงค่าจากตัวแปร PORT ตัวเดียวกันใน .env
      - "${PORT:-3000}:${PORT:-3000}"
    volumes:
      - public_uploads:/app/public/uploads
    healthcheck:
      # [แก้ไข] ปรับให้ยิงทดสอบไปยังพอร์ตจริงแปรผันตามค่าใน .env 
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:${PORT:-3000}/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - mis-network

# [ปรับปรุง] ถอดบล็อกบริการ nginx ออกไปเลย เนื่องจากใช้ Proxy Manager ด้านนอกแล้ว

volumes:
  mariadb_data:
    driver: local
  redis_data:
    driver: local
  public_uploads:
    driver: local

networks:
  mis-network:
    driver: bridge
